name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Check the built CSS is current
        run: |
          sh scripts/build_css.sh
          git diff --exit-code frontend/shared/tailwind.css
      - name: Start the server
        run: |
          NB_DATA_DIR=/tmp/nb-smoke python -m uvicorn main:app --port 8821 &
          for i in $(seq 1 30); do curl -sf localhost:8821/app/ >/dev/null && break; sleep 1; done
        working-directory: backend
      - run: node scripts/smoke_test.js
